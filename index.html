<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente IA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="contenedor">

        <header>
            <h1>🤖 Turnero digital</h1>
            <p>Realiza una consulta para buscar horario disponible.</p>
        </header>

        <section id="chat" class="chat">

            <div class="mensaje bot">
                ¡Hola! 👋<br><br>
                Solicita tu turno y yo te dire horarios disponibles
            </div>

        </section>

        <form id="chatForm" class="entrada">

            <input
                type="text"
                id="pregunta"
                placeholder="Escribe tu consulta..."
                autocomplete="off"
                required>

            <button type="submit">
                Enviar
            </button>

        </form>

    </main>

    <script src="app.js"></script>

</body>

</html>
